name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.13']
        build_cmd: ['hatch build']
        include:
          - python: '3.9'
            # hatch build creates a virtualenv that has dropped the propose_interpreters
            # API used by hatch on Python 3.9. Use python -m build (stdlib venv) instead.
            build_cmd: 'python -m build'

    env:
      TERM: xterm-256color
      RELEASE_FILE: ${{ github.event.repository.name }}-${{ github.event.release.tag_name || github.sha }}-py${{ matrix.python }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: |
          make dev-deps

      - name: Build Packages
        run: |
          make check
          ${{ matrix.build_cmd }}

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FILE }}
          path: dist/
