name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.13']

    env:
      TERM: xterm-256color
      RELEASE_FILE: ${{ github.event.repository.name }}-${{ github.event.release.tag_name || github.sha }}-py${{ matrix.python }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: |
          make dev-deps

      - name: Build Packages
        if: matrix.python != '3.9'
        run: |
          make build

      - name: Build Packages (Python 3.9)
        if: matrix.python == '3.9'
        # hatch build fails on Python 3.9: the installed virtualenv dropped the
        # propose_interpreters API that hatch depends on. python -m build uses
        # stdlib venv instead and is unaffected. All other versions use hatch build.
        run: |
          make check
          python -m build

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FILE }}
          path: dist/
