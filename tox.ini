[tox]
envlist = py,qa
skip_missing_interpreters = True
isolated_build = true
minversion = 4.0.0

[testenv]
deps =
	mock
	pytest>=3.1
	pytest-cov
	build
commands =
	coverage run -m pytest -v -r wsx
	coverage report

[testenv:qa]
skip_install = true
commands =
	check-manifest
	python -m build --no-isolation
	python -m twine check dist/*
	isort --check .
	ruff check .
	codespell .
deps =
	-r{toxinidir}/requirements-dev.txt

